<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใต้พรม</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ece8fb;--fg:#2a2540;--card:#fbfaff;--ac:#6c4fe0;--ac2:#a78bff;--mut:#6f6a8a;--bd:#d9d3f3}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Noto Sans Thai","Sarabun",system-ui,sans-serif}
.top{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:14px 16px 18px;position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;gap:10px;max-width:820px;margin:auto}
.logo{font-weight:700;font-size:1.25rem;flex:1}.logo small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.me{display:flex;align-items:center;gap:6px;font-size:.8rem}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;flex:none}
.search{max-width:820px;margin:10px auto 0}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
.wrap{max-width:820px;margin:auto;padding:12px 14px 90px}
.rooms{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.room{flex:none;width:88px;text-align:center;padding:10px 6px 8px;border-radius:18px;cursor:pointer;font-size:.8rem;font-weight:700;color:#fff;border:3px solid #2a2540;box-shadow:3px 3px 0 #2a2540;transition:transform .15s;background:linear-gradient(145deg,var(--c1),var(--c2));text-shadow:1px 1px 0 #0006}
.room:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2a2540}
.room svg{width:46px;height:46px;display:block;margin:0 auto 4px}
.room small{display:block;font-size:.6rem;font-weight:400;opacity:.95}
.room.on{outline:3px solid var(--ac);outline-offset:2px;transform:rotate(-3deg) scale(1.06)}
.rooms{gap:12px;padding:6px 6px 14px}
.hero2{position:relative;background:#2e2370;color:#fff;border-radius:22px;padding:18px 16px;margin:4px 0 12px;overflow:hidden;border:3px solid #ff5ecb;box-shadow:4px 4px 0 #ffe14d}
.hero2 h1{margin:0;font-size:2.6rem;line-height:1.1;background:linear-gradient(90deg,#ff5ecb,#ffe14d,#4dffb8);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.hero2 p{margin:6px 0 0;font-size:.85rem;opacity:.9;max-width:62%}
.hero2 svg{position:absolute;right:-4px;bottom:-4px;width:130px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.topic{cursor:pointer;display:flex;gap:12px}.topic h3{margin:0 0 4px;font-size:1.02rem}
.meta{font-size:.78rem;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--bd);border-radius:10px;padding:1px 9px;font-size:.72rem;color:var(--fg)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:22px;padding:9px 18px;font:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px #0004;padding:13px 22px;z-index:6}
.body{white-space:pre-wrap;word-break:break-word}
.cm{border-top:1px solid var(--bd);padding:10px 0;display:flex;gap:10px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.hero{font-size:3rem;text-align:center}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#modal.show{display:flex}#modal .sheet{background:var(--card);width:100%;max-width:820px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90%;overflow:auto}
.sheet input,.sheet select,.sheet textarea{margin:5px 0}
</style></head><body>
<div class="top"><div class="row"><div class="logo">🧹 ใต้พรม<small>เปิดพรมดูว่าอะไรถูกซ่อน · พื้นที่คุยเรื่องบ้านเมือง</small></div>
<div class="me" id="me"></div></div>
<div class="search"><input id="q" placeholder="🔍 ค้นหากระทู้"></div></div>
<div class="wrap" id="app"><div class="empty">กำลังโหลด…</div></div>
<button class="btn fab" id="fab" hidden>✏️ ตั้งกระทู้</button>
<div id="modal"><div class="sheet">
<h3 style="margin:0">ตั้งกระทู้ใหม่</h3>
<select id="nr"></select><input id="nt" maxlength="120" placeholder="หัวข้อกระทู้">
<textarea id="nb" rows="6" maxlength="3000" placeholder="เนื้อหา (ถ้ากล่าวถึงข้อกล่าวหาต่อบุคคล โปรดแนบแหล่งอ้างอิง)"></textarea>
<input id="ns" maxlength="300" placeholder="ลิงก์แหล่งอ้างอิง (ถ้ามี)">
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="ok">โพสต์</button><button class="btn g" id="no">ยกเลิก</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ใส่ค่าจาก Firebase Console > Project settings > Your apps (Web) =====
const FIREBASE_CONFIG={apiKey:"AIzaSyAqgOPTsIRcLbqEXgZ8WlMGiNd-y5yyhEI",authDomain:"taiprom.firebaseapp.com",projectId:"taiprom",appId:"1:805483780775:web:9f47184a544fe7d20e1982"};
// uid ของแอดมิน (ดูได้ใน Firebase > Authentication หลังล็อกอินครั้งแรก)
const ADMINS=[];
</script>
<script>
const S=b=>'<svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">'+b+'</svg>';
const R=[["ทั้งหมด",S('<circle cx="24" cy="24" r="17" fill="#fff"/><path d="M7 24h34M24 7c-9 9-9 25 0 34M24 7c9 9 9 25 0 34"/>'),"#7c5cff","#4d9bff"],
["การเมือง",S('<path d="M6 18 24 7l18 11z" fill="#ffe14d"/><path d="M12 22v14M21 22v14M30 22v14M38 22v14M6 41h36"/>'),"#ff3d81","#ff8a4d"],
["เกษตร/UPOV",S('<path d="M24 43V20"/><path d="M24 30c-8 0-11-5-11-12 8 0 11 5 11 12z" fill="#4dffb8"/><path d="M24 23c8 0 11-5 11-12-8 0-11 5-11 12z" fill="#fff"/>'),"#12c98b","#a6e22e"],
["เศรษฐกิจ",S('<circle cx="24" cy="24" r="17" fill="#ffe14d"/><text x="24" y="32" font-size="22" font-weight="800" text-anchor="middle" fill="#111" stroke="none">฿</text>'),"#ff9f1c","#ff5e3a"],
["สังคม",S('<circle cx="17" cy="15" r="6" fill="#fff"/><circle cx="33" cy="18" r="5" fill="#ffe14d"/><path d="M5 40c0-8 6-12 12-12s12 4 12 12zM31 30c6 0 12 3 12 10H33"/>'),"#00b4d8","#7c5cff"],
["สิทธิเสรีภาพ",S('<path d="M7 19h8l18-9v28l-18-9H7z" fill="#fff"/><path d="M15 29l3 11h6l-3-10M39 18c2 3 2 9 0 12"/>'),"#ff4d4d","#b5179e"],
["ต่างประเทศ",S('<path d="M43 7 5 21l14 6 6 14z" fill="#fff"/><path d="M19 27 43 7"/>'),"#3a86ff","#00d2d3"],
["ทั่วไป",S('<path d="M7 10h34v23H22l-9 8v-8H7z" fill="#fff"/><path d="M15 19h18M15 26h11"/>'),"#8338ec","#ff5ecb"]];
const RUG='<svg viewBox="0 0 120 90"><path d="M10 44 100 34l12 38-90 12z" fill="#ff3d81" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M30 50l56-6M34 66l60-6" stroke="#ffe14d" stroke-width="4"/><circle cx="52" cy="30" r="6" fill="#fff"/><circle cx="70" cy="28" r="6" fill="#fff"/><circle cx="53" cy="31" r="3" fill="#111"/><circle cx="71" cy="29" r="3" fill="#111"/><path d="M10 44 40 30c10 2 14 10 6 22z" fill="#ff8ab8" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
const $=i=>document.getElementById(i);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cols=["#5b3fd1","#d1503f","#2a9d8f","#e9a23b","#3b82c4","#c43b8f"];
const colr=s=>cols[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%cols.length];
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?"เมื่อครู่":m<60?Math.floor(m)+" นาทีที่แล้ว":m<1440?Math.floor(m/60)+" ชม.ที่แล้ว":Math.floor(m/1440)+" วันที่แล้ว"};
(async()=>{
firebase.initializeApp(FIREBASE_CONFIG);
const fa=firebase.auth(),fs=firebase.firestore();
const fu=await new Promise(r=>fa.onAuthStateChanged(r));
let db=null,user=null,myName="";
if(fu){try{const d=await fs.collection("users").doc(fu.uid).get();if(d.exists)myName=d.data().name||""}catch(e){}}
if(fu&&myName){
 db=fs;
 user={id:async()=>fu.uid,me:async()=>({name:myName}),canEdit:()=>ADMINS.includes(fu.uid),
  profiles:async ids=>{const o={};await Promise.all(ids.map(async i=>{try{const d=await fs.collection("users").doc(i).get();o[i]={name:d.exists?d.data().name:""}}catch(e){o[i]={name:""}}}));return o}};
}
const app=$("app");
if(!db||!user){app.textContent="";const h=E("div","card");h.append(E("div","hero","👋"),E("h3",null,"ใส่ชื่อเพื่อเริ่มเม้าท์"),(()=>{const w=E("div");const i=E("input");i.maxLength=30;i.placeholder="พิมพ์ชื่อที่อยากใช้ (เช่น แมวส้ม)";const b=E("button","btn","เข้าใช้งาน");b.style.marginTop="8px";
b.onclick=async()=>{const n=i.value.trim();if(!n){alert("กรอกชื่อก่อน");return}b.disabled=true;try{const u=fu||(await fa.signInAnonymously()).user;await fs.collection("users").doc(u.uid).set({name:n});location.reload()}catch(e){alert("เข้าใช้ไม่ได้: "+e.message);b.disabled=false}};
w.append(i,b);return w})());app.append(h);return}
const uid=await user.id(),me=await user.me();
const avatar=(id,name,sz)=>{const a=E("span","av",(name||"?").trim().charAt(0).toUpperCase());a.style.background=colr(id);if(sz){a.style.width=a.style.height=sz+"px"}return a};
$("me").append(avatar(uid,me.name),E("span",null,me.name||"สมาชิก"));
$("fab").hidden=false;$("me").style.cursor="pointer";$("me").onclick=async()=>{const n=prompt("เปลี่ยนชื่อที่แสดง:",me.name);if(n&&n.trim()){await fs.collection("users").doc(uid).set({name:n.trim()});location.reload()}};
let posts=[],room="ทั้งหมด",names={},cur=null,unC=null;
const P=db.collection("posts"),C=db.collection("comments");
async function loadNames(ids){const n=await user.profiles([...new Set(ids)]);for(const k in n)names[k]=n[k].name||"สมาชิก"}
function list(){
 cur=null;if(unC){unC();unC=null}
 app.textContent="";
 const hr=E("div","hero2");hr.innerHTML='<h1>ใต้พรม</h1><p>เปิดพรมดูว่าอะไรถูกซ่อน 👀<br>เลือกห้องที่อยากเม้าท์ ↓</p>'+RUG;app.append(hr);
 const rr=E("div","rooms");
 R.forEach(([n,svg,c1,c2])=>{const r=E("div","room"+(n===room?" on":""));r.style.setProperty("--c1",c1);r.style.setProperty("--c2",c2);r.innerHTML=svg;r.append(n,E("small",null,"#ใต้พรม"));r.onclick=()=>{room=n;list()};rr.append(r)});
 app.append(rr);
 const q=$("q").value.trim().toLowerCase();
 const rows=posts.filter(p=>(room==="ทั้งหมด"||p.room===room)&&(!q||(p.title+p.body).toLowerCase().includes(q)));
 if(!rows.length){const e=E("div","empty");e.append(E("div","hero","🪹"),"ยังไม่มีกระทู้ในห้องนี้ มาตั้งกระทู้แรกกัน");app.append(e)}
 rows.forEach(p=>{
  const c=E("div","card topic");const b=E("div");b.style.flex="1";
  b.append(E("h3",null,p.title));
  const m=E("div","meta");m.append(E("span","chip",p.room),E("span",null,names[p.uid]||"สมาชิก"),E("span",null,ago(p.ts)),E("span",null,"❤️ "+(p.likes||[]).length),E("span",null,"💬 "+(p.nc||0)));
  b.append(m);c.append(avatar(p.uid,names[p.uid]),b);c.onclick=()=>open(p);app.append(c)});
}
function open(p){
 if(unC){unC();unC=null}cur=p.id;const y=scrollY;app.textContent="";setTimeout(()=>scrollTo(0,y),0);
 const back=E("button","btn g","← กลับ");back.onclick=list;app.append(back);
 const c=E("div","card");
 const h=E("div","meta");h.append(avatar(p.uid,names[p.uid]),E("b",null,names[p.uid]||"สมาชิก"),E("span",null,ago(p.ts)),E("span","chip",p.room));
 c.append(h,E("h2",null,p.title),E("div","body",p.body));
 if(/^https?:\/\//.test(p.src||"")){const a=E("a",null,"🔗 แหล่งอ้างอิง");a.href=p.src;a.target="_blank";a.rel="noopener noreferrer";c.append(E("br"),a)}
 const bar=E("div");bar.style.cssText="margin-top:12px;display:flex;gap:8px";
 const lk=(p.likes||[]).includes(uid);
 const l=E("button","btn"+(lk?"":" g"),"❤️ "+(p.likes||[]).length);
 l.onclick=()=>{const s=new Set(p.likes||[]);s.has(uid)?s.delete(uid):s.add(uid);P.doc(p.id).update({likes:[...s]})};
 bar.append(l);
 if(p.uid===uid||user.canEdit()){const d=E("button","btn g","ลบกระทู้");d.onclick=()=>{if(confirm("ลบกระทู้นี้?")){P.doc(p.id).delete();list()}};bar.append(d)}
 c.append(bar);app.append(c);
 const cc=E("div","card");cc.append(E("b",null,"ความคิดเห็น"));const box=E("div");cc.append(box);
 const ta=E("textarea");ta.rows=3;ta.maxLength=1500;ta.placeholder="แสดงความคิดเห็น…";
 const sb=E("button","btn","ส่ง");sb.style.marginTop="6px";
 sb.onclick=async()=>{const t=ta.value.trim();if(!t)return;try{await C.add({pid:p.id,uid,body:t,ts:Date.now()});ta.value="";await P.doc(p.id).update({nc:(p.nc||0)+1})}catch(e){alert("ส่งไม่สำเร็จ")}};
 cc.append(ta,sb);app.append(cc);
 unC=C.where("pid","==",p.id).onSnapshot(async s=>{
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);
  await loadNames(rows.map(r=>r.uid));box.textContent="";
  if(!rows.length)box.append(E("div","empty","ยังไม่มีความคิดเห็น"));
  rows.forEach((r,i)=>{const w=E("div","cm");const x=E("div");x.style.flex="1";
   const m=E("div","meta");m.append(E("b",null,"#"+(i+1)+" "+(names[r.uid]||"สมาชิก")),E("span",null,ago(r.ts)));
   if(r.uid===uid||user.canEdit()){const d=E("a",null,"ลบ");d.style.cursor="pointer";d.onclick=()=>C.doc(r.id).delete();m.append(d)}
   x.append(m,E("div","body",r.body));w.append(avatar(r.uid,names[r.uid]),x);box.append(w)})});
 }
P.orderBy("ts","desc").limit(150).onSnapshot(async s=>{
 posts=s.docs.map(d=>({id:d.id,...d.data()}));
 await loadNames(posts.map(p=>p.uid));
 if(cur){const p=posts.find(x=>x.id===cur);if(p)open(p)}else list();
},()=>{app.textContent="โหลดข้อมูลไม่ได้"});
$("q").oninput=()=>{if(!cur)list()};
$("nr").append(...R.slice(1).map(([n])=>{const o=E("option",null,n);o.value=n;return o}));
$("fab").onclick=()=>$("modal").classList.add("show");
$("no").onclick=()=>$("modal").classList.remove("show");
$("ok").onclick=async()=>{
 const title=$("nt").value.trim(),body=$("nb").value.trim();
 if(!title||!body){alert("กรอกหัวข้อและเนื้อหา");return}
 try{await P.add({uid,title,body,src:$("ns").value.trim(),room:$("nr").value,ts:Date.now(),likes:[],nc:0});
  $("nt").value=$("nb").value=$("ns").value="";$("modal").classList.remove("show")}catch(e){alert("โพสต์ไม่สำเร็จ (อาจไม่มีสิทธิ์เขียน)")}};
})();
</script></body></html>
